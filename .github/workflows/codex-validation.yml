name: Manifest command block validation
on: push
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest ruff
      - run: pytest tests/ -q --tb=short
      - run: ruff check tests/test_manifest_commands.py
      - run: |
          shim echo "smoke test"
          shim --json echo '{"test": true}'
          shim --manifest git
